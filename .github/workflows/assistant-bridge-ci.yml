name: Assistant bridge checks

on:
  pull_request:
    paths:
      - "assistant_bridge/**"
      - "app/main.py"
      - ".github/workflows/assistant-bridge-ci.yml"
  workflow_dispatch:

jobs:
  bridge-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated contract-test dependencies
        run: python -m pip install "fastapi>=0.110" "pydantic>=2" "httpx>=0.27" "pytest>=8"
      - name: Compile bridge modules
        run: python -m compileall -q assistant_bridge
      - name: Run bridge contract tests (no external providers)
        env:
          PYTHONPATH: .
        run: python -m pytest -q assistant_bridge/test_bridge.py assistant_bridge/test_codexia_adapter.py assistant_bridge/test_ownership.py assistant_bridge/test_owner_listing.py assistant_bridge/test_dashboard_contract.py assistant_bridge/test_execution_safety.py
