name: Apply RQ Worker Liveness Fix

on:
  push:
    branches:
      - fix/rq-worker-liveness-idle

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[rq-liveness-patched]') && !contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codexia_ci
          POSTGRES_USER: codexia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia_ci -d codexia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: homologation
      DATABASE_URL: postgresql://codexia_ci@127.0.0.1:5432/codexia_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/rq-worker-liveness-idle

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply canonical migrations
        run: python scripts/apply_migrations.py

      - name: Apply targeted liveness patch
        run: python scripts/apply_rq_worker_liveness_fix.py

      - name: Compile changed Python
        run: python -m py_compile app/routers/youtube.py tests/test_cx33_retry_dispatch_regression.py

      - name: Run targeted regressions
        run: |
          python -m unittest \
            tests.test_cx33_retry_dispatch_regression \
            tests.test_cx33_queue_fail_closed \
            tests.test_failed_story_retry_recovery

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/youtube.py tests/test_cx33_retry_dispatch_regression.py
          git diff --cached --check
          git commit -m "fix: trust RQ worker registration while idle [rq-liveness-patched]"
          git push origin HEAD:fix/rq-worker-liveness-idle
