name: Apply CX33 Retry Fix

on:
  push:
    branches:
      - fix/cx33-retry-failclosed-diagnostics

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[cx33-patched]') && !contains(github.event.head_commit.message, '[cleanup]') && !contains(github.event.head_commit.message, '[ci-debug]') }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codexia_ci
          POSTGRES_USER: codexia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia_ci -d codexia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      APP_ENV: homologation
      DATABASE_URL: postgresql://codexia_ci@127.0.0.1:5432/codexia_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/cx33-retry-failclosed-diagnostics

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m pip install pytest

      - name: Apply canonical migrations
        run: python scripts/apply_migrations.py

      - name: Apply targeted source patch
        run: python scripts/apply_cx33_retry_fix.py

      - name: Compile changed Python
        run: python -m py_compile app/routers/youtube.py tests/test_cx33_retry_dispatch_regression.py

      - name: Run targeted regression tests
        run: |
          set +e
          python -m pytest -q \
            tests/test_cx33_retry_dispatch_regression.py \
            tests/test_cx33_queue_fail_closed.py \
            tests/test_failed_story_retry_recovery.py > /tmp/cx33-pytest.log 2>&1
          rc=$?
          cat /tmp/cx33-pytest.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/cx33-pytest.log ci_cx33_failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ci_cx33_failure.log
            git commit -m "ci: capture CX33 regression failure [ci-debug]"
            git push origin HEAD:fix/cx33-retry-failclosed-diagnostics
            exit "$rc"
          fi

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/routers/youtube.py app/static/index.html tests/test_cx33_retry_dispatch_regression.py
          git diff --cached --check
          git commit -m "fix: route retries exclusively to CX33 and show diagnostics [cx33-patched]"
          git push origin HEAD:fix/cx33-retry-failclosed-diagnostics
