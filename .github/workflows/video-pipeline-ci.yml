name: Deploy probe PR93

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/video-pipeline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-probe-pr93-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Production API read-only probe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe production without paid providers
        env:
          BASE_URL: "https://g8w4so4gkkgog0scsw0ogwkw.89.167.1.253.sslip.io"
          EXPECTED_COMMIT: "cb48b3436bfb35cf9248be82d94a4a5695b6d5d9"
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_COMMIT"].strip()

          def get_json(path, timeout=15):
              req = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "Codexia-Deploy-Probe/1.0", "Accept": "application/json"},
              )
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  raw = response.read().decode("utf-8", "replace")
                  return response.status, json.loads(raw)

          last = None
          for attempt in range(30):
              try:
                  status, health = get_json("/health")
                  last = health
                  current = str(health.get("commit") or "").strip()
                  print("HEALTH_STATUS=", status)
                  print("HEALTH_JSON=", json.dumps(health, ensure_ascii=False, sort_keys=True))
                  if status == 200 and health.get("status") == "ok" and current == expected:
                      break
              except Exception as exc:
                  print(f"health attempt {attempt + 1}: {type(exc).__name__}: {exc}")
              if attempt < 29:
                  time.sleep(10)
          else:
              raise SystemExit(f"Production did not report expected commit {expected}; last={last!r}")

          status, api_status = get_json("/api/status")
          print("API_STATUS_HTTP=", status)
          print("API_STATUS_JSON=", json.dumps(api_status, ensure_ascii=False, sort_keys=True))
          if status != 200:
              raise SystemExit("/api/status failed")

          status, db_health = get_json("/health/db")
          print("DB_HEALTH_HTTP=", status)
          print("DB_HEALTH_JSON=", json.dumps(db_health, ensure_ascii=False, sort_keys=True))
          if status != 200 or db_health.get("error"):
              raise SystemExit("/health/db failed")

          status, spec = get_json("/openapi.json")
          paths = sorted((spec.get("paths") or {}).keys())
          worker_candidates = [
              path for path in paths
              if any(term in path.lower() for term in ("worker", "heartbeat", "server", "queue"))
          ]
          print("OPENAPI_HTTP=", status)
          print("READ_ONLY_WORKER_ROUTE_CANDIDATES=", json.dumps(worker_candidates, ensure_ascii=False))
          print("DEPLOY_PROBE_OK expected_commit=" + expected)
          PY
