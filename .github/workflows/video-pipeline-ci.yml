name: Video pipeline CI

on:
  pull_request:
    branches:
      - main
      - homolog/youtube-auto-e2e
    paths:
      - ".github/workflows/video-pipeline-ci.yml"
      - "Dockerfile"
      - "Dockerfile.worker"
      - "alembic/**"
      - "app/**"
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: PostgreSQL, pipeline and smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codexia_ci
          POSTGRES_USER: codexia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia_ci -d codexia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: homologation
      DATABASE_URL: postgresql://codexia_ci@127.0.0.1:5432/codexia_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 ffmpeg >/dev/null
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt

      - name: Apply and verify hardening with Codexia V2 bridge
        run: |
          python scripts/run_build_hardening.py --profile api
          python scripts/codexia_v2_legacy_ui_bridge.py check
          python -m compileall -q app scripts
          # The canonical narration files are source-owned. No hardening step may rewrite them.
          git diff --exit-code -- app/services/narration_core.py app/services/youtube_narration_gate.py app/services/narration_contract_guard.py app/static/youtube_narration_gate.js
          python -m unittest tests.test_narration_core_v1 -q
          python -m unittest tests.test_duration_seconds_support -q
          python -m unittest tests.test_cinematic_v2 -q

      - name: Apply canonical Alembic migration on PostgreSQL
        run: |
          python scripts/apply_migrations.py
          alembic current | grep --fixed-strings "d7e8f9a0b1c2"
          python scripts/check_schema_consistency.py

      - name: Start application against migrated PostgreSQL
        env:
          PREFLIGHT_STARTUP_TIMEOUT_SEC: "35"
        run: python scripts/preflight_validate.py

      - name: Run complete test suite
        env:
          APP_ENV: development
          ENABLE_SQLITE_DEV: "true"
          DATABASE_URL: sqlite:////tmp/codexia-video-pipeline-ci.sqlite3
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -q > /tmp/codexia-unittest.log 2>&1
          test_status=$?
          if [ "$test_status" -ne 0 ]; then
            echo "===== UNIT TEST FAILURES ====="
            tail -n 180 /tmp/codexia-unittest.log
            python - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/codexia-unittest.log').read_text(encoding='utf-8', errors='replace')
          lines = raw.splitlines()
          compact = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('FAIL: ') or stripped.startswith('ERROR: '):
                  compact.append(stripped[:1200])
              elif stripped.startswith('Ran ') or stripped.startswith('FAILED ('):
                  compact.append(stripped[:1200])
          if not compact:
              compact = [line[:1200] for line in lines[-30:] if line.strip()]
          message = '\n'.join(compact[-40:])[-7000:]
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Failing unit tests::{escaped}')
          PY
            exit "$test_status"
          fi
          echo "Complete unit suite: OK"

      - name: Run real FFmpeg smoke without paid providers
        env:
          APP_ENV: development
          ENABLE_SQLITE_DEV: "true"
          DATABASE_URL: sqlite:////tmp/codexia-video-pipeline-smoke.sqlite3
        run: python tests/smoke_e2e_stability.py
