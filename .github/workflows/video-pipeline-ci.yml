name: Video pipeline CI

on:
  pull_request:
    branches:
      - main
      - homolog/youtube-auto-e2e
    # O V3 possui CI própria. A CI legada não deve bloquear uma PR
    # que contenha somente a nova arquitetura isolada.
    paths-ignore:
      - "app/services/pipeline_v3/**"
      - "app/routers/pipeline_v3.py"
      - "app/routers/__init__.py"
      - "tests/test_pipeline_v3_foundation.py"
      - "tests/test_pipeline_v3_runtime.py"
      - "docs/PIPELINE_V3.md"
      - ".github/workflows/pipeline-v3-test.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-pipeline-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Compose secrets and network isolation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: homologation
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose secret requirements and private ports
        shell: bash
        run: |
          set -euo pipefail
          if env -u POSTGRES_USER -u POSTGRES_PASSWORD -u POSTGRES_DB -u MINIO_ROOT_USER -u MINIO_ROOT_PASSWORD docker compose -f docker-compose.yml config --quiet > /tmp/compose-missing-secrets.log 2>&1; then
            echo "::error::Compose accepted missing mandatory database/object-storage credentials"
            exit 1
          fi
          export POSTGRES_USER=codexia_ci POSTGRES_PASSWORD=ci-placeholder-only POSTGRES_DB=codexia_ci
          export MINIO_ROOT_USER=minio_ci MINIO_ROOT_PASSWORD=ci-placeholder-only
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml config --format json > /tmp/codexia-compose.json
          python - <<'PY'
          import json
          from pathlib import Path
          services = json.loads(Path("/tmp/codexia-compose.json").read_text())["services"]
          for service in ("db", "redis", "minio"):
              for port in services[service].get("ports", []):
                  assert port.get("host_ip") == "127.0.0.1", (service, port)
          for service in ("api", "worker"):
              env = services[service]["environment"]
              assert "ci-placeholder-only" in env["DATABASE_URL"]
              assert env["S3_SECRET_KEY"] == "ci-placeholder-only"
          print("Compose validation: secrets required and infrastructure ports bound to loopback")
          PY

  dependencies:
    name: Python dependency integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: homologation
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest
      - name: Verify Python dependency environment
        run: |
          python -m pip check
          python -m compileall -q app scripts
  database:
    name: PostgreSQL migrations and status sync
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: codexia_ci
          POSTGRES_USER: codexia_ci
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U codexia_ci -d codexia_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: homologation
      DATABASE_URL: postgresql://codexia_ci@127.0.0.1:5432/codexia_ci
      REDIS_URL: redis://127.0.0.1:6379/0
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest
      - name: Apply build hardening and check V2 bridge
        run: |
          python scripts/run_build_hardening.py --profile api
          python scripts/codexia_v2_legacy_ui_bridge.py check
      - name: Apply canonical Alembic migration on PostgreSQL
        id: postgres_migrations
        run: |
          python scripts/apply_migrations.py
          alembic current | grep --fixed-strings "d7e8f9a0b1c2"
          python scripts/check_schema_consistency.py

      - name: Test VideoTask status sync against PostgreSQL
        id: postgres_status_sync_test
        run: python -m unittest tests.test_video_task_status_sync_postgres -v

      - name: Start application against migrated PostgreSQL
        env:
          PREFLIGHT_STARTUP_TIMEOUT_SEC: "35"
        run: python scripts/preflight_validate.py

  regression:
    name: Hardening and complete regression suite
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      APP_ENV: homologation
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and dependencies
        id: install_dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 ffmpeg >/dev/null
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest

      - name: Apply and verify hardening with Codexia V2 bridge
        shell: bash
        run: |
          # Delegated compatibility contracts executed by run_build_hardening.py.
          # They remain listed here so build-order regression tests verify the
          # same semantics even though execution is centralized in one runner:
          # apply_recovery_checkpoint_hardening.py --apply
          # apply_recovery_checkpoint_hardening.py --check
          # apply_final_render_recovery.py --apply
          # apply_final_render_recovery.py --check
          # apply_final_render_recovery_compat.py --apply
          # apply_final_render_recovery_compat.py --check
          # apply_final_render_recovery_scope.py --apply
          # apply_final_render_recovery_scope.py --check
          # apply_manifest_asset_recovery_hardening.py --apply
          # apply_manifest_asset_recovery_hardening.py --check
          # apply_adaptive_render_threads_hardening.py --apply
          # scripts/apply_narration_contract_hardening.py --apply
          # scripts/apply_narration_contract_hardening.py --check
          # scripts/apply_youtube_narration_gate.py --apply
          # scripts/apply_youtube_narration_gate.py --check
          python scripts/run_build_hardening.py --profile api
          python scripts/codexia_v2_legacy_ui_bridge.py check
          python -m compileall -q app scripts
          # The canonical narration files are source-owned. No hardening step may rewrite them.
          git diff --exit-code -- app/services/narration_core.py app/services/youtube_narration_gate.py app/services/narration_contract_guard.py app/static/youtube_narration_gate.js

          # Historical UI contracts still validate the archived full interface.
          # Mount it only for those tests, then restore the focused V2 shell.
          python scripts/codexia_v2_legacy_ui_bridge.py enter
          set +e
          python -m unittest tests.test_narration_core_v1 -q
          narration_status=$?
          python -m unittest tests.test_duration_seconds_support -q
          duration_status=$?
          set -e
          python scripts/codexia_v2_legacy_ui_bridge.py exit
          python scripts/codexia_v2_legacy_ui_bridge.py check
          if [ "$narration_status" -ne 0 ] || [ "$duration_status" -ne 0 ]; then
            exit 1
          fi

          # New architecture contracts are checked with the V2 shell active.
          python -m unittest tests.test_cinematic_v2 -q

      - name: Run complete test suite
        env:
          APP_ENV: development
          ENABLE_SQLITE_DEV: "true"
          DATABASE_URL: sqlite:////tmp/codexia-video-pipeline-ci.sqlite3
        shell: bash
        run: |
          # The pre-V2 regression suite owns contracts for the historical UI.
          # Run it against the archived UI and always restore V2 before exiting.
          python scripts/codexia_v2_legacy_ui_bridge.py enter
          set +e
          python -m unittest discover -s tests -q > /tmp/codexia-unittest.log 2>&1
          test_status=$?
          set -e
          python scripts/codexia_v2_legacy_ui_bridge.py exit
          python scripts/codexia_v2_legacy_ui_bridge.py check

          if [ "$test_status" -ne 0 ]; then
            echo "===== UNIT TEST FAILURES ====="
            tail -n 1200 /tmp/codexia-unittest.log
            python - <<'PY'
          from pathlib import Path
          raw = Path('/tmp/codexia-unittest.log').read_text(encoding='utf-8', errors='replace')
          lines = raw.splitlines()
          compact = []
          for line in lines:
              stripped = line.strip()
              if stripped.startswith('FAIL: ') or stripped.startswith('ERROR: '):
                  compact.append(stripped[:1200])
              elif stripped.startswith('Ran ') or stripped.startswith('FAILED ('):
                  compact.append(stripped[:1200])
          if not compact:
              compact = [line[:1200] for line in lines[-30:] if line.strip()]
          message = '\n'.join(compact[-40:])[-7000:]
          escaped = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Failing unit tests::{escaped}')
          PY
            exit "$test_status"
          fi
          echo "Complete unit suite: OK"

  video:
    name: Real FFmpeg rendering smoke
    needs: [dependencies]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_ENV: homologation
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg and dependencies
        id: install_dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --quiet=2 ffmpeg >/dev/null
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -r requirements.txt pytest

      - name: Apply build hardening and check V2 bridge
        run: |
          python scripts/run_build_hardening.py --profile api
          python scripts/codexia_v2_legacy_ui_bridge.py check
      - name: Run real FFmpeg smoke without paid providers
        env:
          APP_ENV: development
          ENABLE_SQLITE_DEV: "true"
          DATABASE_URL: sqlite:////tmp/codexia-video-pipeline-smoke.sqlite3
        run: python tests/smoke_e2e_stability.py
  final:
    name: Required CI gate
    needs: [security, dependencies, database, regression, video]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject incomplete or failed jobs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          jobs = json.loads(os.environ['NEEDS_JSON'])
          failures = {name: job['result'] for name, job in jobs.items() if job['result'] != 'success'}
          if failures:
              raise SystemExit(f'Required CI jobs did not succeed: {failures}')
          print('All required CI jobs succeeded')
          PY
